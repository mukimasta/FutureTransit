<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FutureTransit · 调度实验</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101a24;color:#e5edf6}body{max-width:1200px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 8px}p{color:#aabbd0;line-height:1.65;margin:8px 0 18px}.controls{display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;background:#23364b;color:#edf7ff;border:1px solid #62748a;border-radius:6px;padding:8px 12px}input[type=range]{flex:1;min-width:160px}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:24px}.map{background:#142331;border-radius:12px}svg{display:block;width:100%;height:auto}svg text{fill:#d7e2ee;font-size:14px}#status{font-variant-numeric:tabular-nums;line-height:1.8}.stats{display:flex;gap:24px;flex-wrap:wrap}.stats strong{font-size:24px;display:block;color:#80dfc4}#detail{line-height:1.9;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 3px;border-bottom:1px solid #34465a;text-align:left}tr[data-pod]{cursor:pointer}tr[data-pod]:hover{background:#24394b}.table-wrap{max-height:330px;overflow:auto}#route{color:#80dfc4}.legend{font-size:13px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#80dfc4;margin-right:4px}@media(max-width:760px){body{padding:14px}.layout{grid-template-columns:1fr}.stats{gap:15px}}
</style>
<h1>FutureTransit / 楼宇到楼宇调度实验</h1>
<p>10 栋楼 · 5 个支线节点 · 5 个主干 merge / split 节点。楼宇内排队，完整预约后连续运行。</p>
<div class="stats" id="summary"></div>
<div class="controls"><button id="play">播放</button><button id="reset">回到起点</button><label>速度 <select id="speed"><option value="1">1×</option><option value="5" selected>5×</option><option value="15">15×</option></select></label><label for="seek">时间</label><input id="seek" type="range" min="0" step="0.1" value="0"><output id="clock"></output></div>
<div class="layout"><div><div class="map"><svg id="map" viewBox="0 0 880 740" role="img" aria-label="楼宇、支线、主干网络与 Pod 运行轨迹"><g id="tracks"></g><g id="stations"></g><g id="pods"></g></svg></div><p class="legend"><span class="dot"></span>行驶中的 Pod（数字为车辆编号） · 楼宇旁 W 为等待车辆数 · 单线双向共用区间，互斥通行</p></div><div><div id="status" aria-live="off"></div><div class="controls"><label>跟踪车辆 <select id="selected"></select></label></div><div id="detail"></div><p id="route"></p><div class="table-wrap"><table><thead><tr><th>Pod</th><th>起点 → 终点</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>
const data = /*__RUN_DATA__*/ null;
if(!data){document.getElementById('status').textContent='请先运行 simulator.py，打开 results/demo/replay.html。';}
else {
const $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';
const nodes=Object.fromEntries(data.nodes.map(n=>[n.id,n])), trips=data.trips, end=data.metrics.makespan_s;
let now=0,playing=false,selected=0,last=null;
function svg(tag,attrs,parent){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e;}
const lines=[];
for(const e of data.edges){const a=nodes[e.a],b=nodes[e.b];lines.push({edge:e,el:svg('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:e.kind==='trunk'?'#65849e':'#425a70','stroke-width':e.kind==='trunk'?5:3},$('tracks'))});}
const queues={};
for(const n of data.nodes){if(n.kind==='building')svg('rect',{x:n.x-12,y:n.y-12,width:24,height:24,rx:4,fill:'#344c64'},$('stations'));else svg('circle',{cx:n.x,cy:n.y,r:8,fill:'#597691'},$('stations'));const label=svg('text',{x:n.x,y:n.y-20,'text-anchor':'middle'},$('stations'));label.textContent=n.id;if(n.kind==='building'){queues[n.id]=svg('text',{x:n.x,y:n.y+32,'text-anchor':'middle'},$('stations'));}}
const dots=[];
for(let i=0;i<data.metrics.fleet;i++){const g=svg('g',{},$('pods'));svg('circle',{r:10,fill:'#80dfc4',stroke:'#101a24','stroke-width':2},g);const label=svg('text',{'text-anchor':'middle',dy:4,style:'fill:#101a24;font-size:10px;font-weight:700'},g);label.textContent=i;dots.push(g);const op=document.createElement('option');op.value=i;op.textContent=`Pod ${String(i).padStart(2,'0')}`;$('selected').appendChild(op);}
$('summary').innerHTML=`<div><strong>${data.metrics.completed_trips}/${data.metrics.requested_trips}</strong>行程完成</div><div><strong>${data.metrics.throughput_trips_min}</strong>行程 / 模拟分钟</div><div><strong>${data.metrics.mean_wait_s}s</strong>平均楼宇等待</div><div><strong>${data.metrics.conflict_ticks} / ${data.metrics.unfinished_trips}</strong>冲突时隙 / 未完成</div>`;
$('seek').max=end;
function current(pod){const all=trips.filter(t=>t.pod===pod);return all.find(t=>now<t.arrival) || all[all.length-1];}
function state(t){return now<t.ready?'停靠':now<t.departure?'等待':now<t.arrival?'行驶':'到达';}
function draw(){
 $('clock').textContent=`${now.toFixed(1)} / ${end}s`;$('seek').value=now;
 let waiting=0,running=0;const q={};
 for(let i=0;i<dots.length;i++){const t=current(i),s=state(t);if(s==='等待'){waiting++;q[t.origin]=(q[t.origin]||0)+1;}dots[i].style.display=s==='行驶'?'':'none';if(s==='行驶'){running++;const seg=t.segments.find(s=>s.start<=now&&now<s.end);const a=nodes[seg.a],b=nodes[seg.b],f=(now-seg.start)/(seg.end-seg.start);dots[i].setAttribute('transform',`translate(${a.x+(b.x-a.x)*f},${a.y+(b.y-a.y)*f})`);dots[i].firstChild.setAttribute('fill',i===selected?'#ffd17a':'#80dfc4');}}
 for(const [id,el] of Object.entries(queues))el.textContent=q[id]?`W ${q[id]}`:'';
 const completed=trips.filter(t=>t.arrival<=now).length;
 $('status').textContent=`当前：${waiting} 辆等待 · ${running} 辆运行 · 已完成 ${completed} 趟`;
 const t=current(selected);$('detail').textContent=`Pod ${selected} · ${state(t)}｜${t.origin} → ${t.destination}。请求 ${t.ready}s，出发 ${t.departure}s，到达 ${t.arrival}s；楼宇等待 ${t.wait}s。`;$('route').textContent=t.path.join(' → ');
 for(const {edge:e,el} of lines){const active=t.path.some((n,i)=>i&&((n===e.a&&t.path[i-1]===e.b)||(n===e.b&&t.path[i-1]===e.a)));el.setAttribute('stroke',active?'#d1a459':e.kind==='trunk'?'#65849e':'#425a70');}
 $('rows').innerHTML=Array.from({length:dots.length},(_,i)=>{const t=current(i);return `<tr data-pod="${i}"><td>${i}</td><td>${t.origin} → ${t.destination}</td><td>${state(t)}</td></tr>`;}).join('');
}
$('rows').addEventListener('click',e=>{const row=e.target.closest('[data-pod]');if(row){selected=Number(row.dataset.pod);$('selected').value=selected;draw();}});
$('selected').addEventListener('change',e=>{selected=Number(e.target.value);draw();});
$('seek').addEventListener('input',e=>{now=Number(e.target.value);draw();});
$('play').addEventListener('click',()=>{if(now>=end)now=0;playing=!playing;$('play').textContent=playing?'暂停':'播放';draw();});
$('reset').addEventListener('click',()=>{playing=false;now=0;$('play').textContent='播放';draw();});
function frame(stamp){if(last!==null&&playing){now=Math.min(end,now+(stamp-last)/1000*Number($('speed').value));if(now===end){playing=false;$('play').textContent='播放';}draw();}last=stamp;requestAnimationFrame(frame);}
draw();requestAnimationFrame(frame);
}
</script></html>
